services:
  flume:
    build: .
    image: movie-log-flume:1.11.0-local
    init: true
    stop_grace_period: 60s
    volumes:
      - ${RUN_DIR:-./data}:/data
      - ${LOG_DIR:-./logs}:/logs

  spark:
    image: apache/spark:3.5.1
    profiles:
      - spark
    working_dir: /project
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/project
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["scripts/spark_smoke_test.py", "--help"]
