# All paths are inside the Linux container, backed by RUN_DIR on the host.
a1.sources = r1
a1.channels = c1
a1.sinks = k1
a1.sources.r1.type = spooldir
a1.sources.r1.spoolDir = /data/spool
a1.sources.r1.channels = c1
a1.sources.r1.fileSuffix = .COMPLETED
a1.sources.r1.deletePolicy = never
a1.sources.r1.includePattern = ^.*[.]jsonl$
a1.sources.r1.ignorePattern = ^.*[.]tmp$
a1.sources.r1.deserializer = LINE
a1.sources.r1.deserializer.maxLineLength = 16384
a1.sources.r1.inputCharset = UTF-8
a1.sources.r1.decodeErrorPolicy = FAIL
a1.sources.r1.batchSize = 500
a1.channels.c1.type = file
a1.channels.c1.checkpointDir = /data/channel/checkpoint
a1.channels.c1.dataDirs = /data/channel/data
a1.channels.c1.capacity = 1000000
a1.channels.c1.transactionCapacity = 1000
a1.channels.c1.minimumRequiredSpace = 104857600
a1.sinks.k1.type = file_roll
a1.sinks.k1.channel = c1
a1.sinks.k1.sink.directory = /data/output
a1.sinks.k1.sink.pathManager.extension = jsonl
a1.sinks.k1.sink.rollInterval = 10
a1.sinks.k1.sink.batchSize = 500
a1.sinks.k1.sink.serializer = TEXT
a1.sinks.k1.sink.serializer.appendNewline = true
